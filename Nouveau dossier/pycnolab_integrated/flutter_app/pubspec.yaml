name: pycnolab
publish_to: 'none'
description: Interface Flutter de laboratoire avec moteur Python et Studio de normes.
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^8.0.0
  fl_chart: ^0.68.0
  http: ^1.2.0
  math_expressions: ^2.5.0
  path: ^1.9.0
  sqflite_common_ffi: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
