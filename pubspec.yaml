name: pycnolab
description: Interface Flutter pour le moteur de calcul PycnoLab.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  file_picker: ^8.0.0
  path: ^1.9.0
  fl_chart: ^0.68.0
  math_expressions: ^2.4.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/LOGOS.jpg
    - assets/licenses/reserve_cles_1_An.txt
    - assets/licenses/reserve_cles_1_Mois.txt
    - assets/licenses/reserve_cles_3_Mois.txt
    - assets/licenses/reserve_cles_6_Mois.txt
