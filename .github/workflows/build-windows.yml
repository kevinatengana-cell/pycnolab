name: Build PycnoLab Windows & Installer

on:
  push:
    branches: [ main, master, packaging-propre ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies & Build Backend
        shell: pwsh
        run: |
          cd pycno_core
          python -m pip install --upgrade pip
          if (Test-Path "requirements-build.txt") { pip install -r requirements-build.txt }
          elseif (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller
          # Utilise votre fichier .spec officiel
          pyinstaller --clean pycnolab_engine.spec

      - name: Validate bundled Excel model templates
        shell: pwsh
        run: |
          $modelDir = "pycno_core\dist\backend\_internal\moteur_python\models"
          $required = @(
            "MODELE_TRACTION_VIDE.xlsx",
            "MODELE_COMPRESSION_VIDE.xlsx",
            "MODELE_FLEXION_VIDE.xlsx"
          )
          foreach ($name in $required) {
            $path = Join-Path $modelDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Modèle Excel absent du bundle PyInstaller : $path"
            }
            Write-Host "Modèle inclus : $path"
          }
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install Flutter Dependencies & Build App
        run: |
          flutter pub get
          flutter build windows --release

      - name: Prepare Release Folder for Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release"
          Copy-Item -Recurse -Force "build\windows\x64\runner\Release\*" "release\"
          
          New-Item -ItemType Directory -Force -Path "release\backend"
          
          # Recherche automatique et robuste de l'exécutable backend compilé
          $backendExe = Get-ChildItem -Path "pycno_core" -Filter "backend.exe" -Recurse | Select-Object -First 1
          if ($backendExe) {
              Write-Host "Backend trouve : $($backendExe.FullName)"
              Copy-Item -Force $backendExe.FullName "release\backend\"
              $internalDir = Join-Path $backendExe.DirectoryName "_internal"
              if (Test-Path $internalDir) {
                  Copy-Item -Recurse -Force $internalDir "release\backend\"
              }
          } else {
              throw "Erreur critique : backend.exe introuvable sous pycno_core !"
          }

      - name: Install Inno Setup via Chocolatey
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        run: |
          iscc pycnolab.iss

      - name: Upload Artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: PycnoLab-Release-Bundle
          path: |
            InstallerOutput\