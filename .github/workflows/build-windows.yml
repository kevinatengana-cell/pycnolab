name: Build PycnoLab Windows & Installer

on:
  push:
    branches: [ main, master, packaging-propre ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies & Build Backend
        shell: pwsh
        run: |
          python -m venv pycno_core\.venv_build
          $buildPython = "pycno_core\.venv_build\Scripts\python.exe"
          & $buildPython -m pip install --upgrade pip
          & $buildPython -m pip install -r pycno_core\requirements.txt
          & $buildPython -m pip install --upgrade pyinstaller
          & .\pycno_core\build_backend.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Backend build failed with exit code $LASTEXITCODE."
          }

      - name: Validate bundled Excel model templates
        shell: pwsh
        run: |
          $modelDir = "pycno_core\dist\backend\_internal\moteur_python\models"
          $required = @(
            "MODELE_TRACTION_VIDE.xlsx",
            "MODELE_COMPRESSION_VIDE.xlsx",
            "MODELE_FLEXION_VIDE.xlsx"
          )
          foreach ($name in $required) {
            $path = Join-Path $modelDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Modèle Excel absent du bundle PyInstaller : $path"
            }
            Write-Host "Modèle inclus : $path"
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install Flutter Dependencies & Build App
        run: |
          flutter pub get
          flutter build windows --release

      - name: Prepare Release Folder for Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release"
          Copy-Item -Recurse -Force "build\windows\x64\runner\Release\*" "release\"
          
          New-Item -ItemType Directory -Force -Path "release\backend"
          
          $backendDist = "pycno_core\dist\backend"
          if (-not (Test-Path (Join-Path $backendDist "manifest.sha256"))) {
              throw "Manifeste d'intégrité absent : $backendDist\manifest.sha256"
          }
          Copy-Item -Recurse -Force "$backendDist\*" "release\backend\"

      - name: Runtime Visual C++ DLLs Integration
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            $src = "C:\Windows\System32\$d"
            if (Test-Path $src) {
              Copy-Item $src "release\" -Force
              Write-Host "DLL $d ajoutee avec succes dans release\."
            } else {
              Write-Warning "DLL $d introuvable dans le System32 du runner."
            }
          }

      - name: Install Inno Setup via Chocolatey
        run: choco install innosetup -y

      - name: Download Microsoft Visual C++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "vc_redist.x64.exe"
          $signature = Get-AuthenticodeSignature "vc_redist.x64.exe"
          if ($signature.Status -ne "Valid" -or
              $signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            throw "Downloaded VC++ redistributable has no valid Microsoft signature."
          }

      - name: Compile Inno Setup Installer
        run: |
          iscc pycnolab.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }
          Remove-Item -LiteralPath "vc_redist.x64.exe" -Force

      - name: Upload Artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: PycnoLab-Release-Bundle
          path: |
            InstallerOutput/